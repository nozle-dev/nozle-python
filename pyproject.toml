[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nozle-sdk"
dynamic = ["version"]
description = "Nozle SDK — usage tracking, margin intelligence, and entitlement checks for AI billing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Nozle", email = "dev@nozle.ai" },
]
keywords = ["billing", "usage-tracking", "margin", "ai", "metering", "entitlements"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["openai>=1.0", "anthropic>=0.30.0"]
dev = [
    "build>=1.2",
    "mypy>=1.11,<1.19",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "requests-mock>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://nozle.ai"
Repository = "https://github.com/nozle-dev/nozle-python"
Issues = "https://github.com/nozle-dev/nozle-python/issues"

[tool.setuptools.packages.find]
include = ["nozle*"]

[tool.setuptools.dynamic]
version = { attr = "nozle._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
