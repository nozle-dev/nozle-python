name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  quality:
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check nozle tests examples/billing_portal
      - run: ruff check nozle tests examples/billing_portal
      - run: mypy nozle examples/billing_portal

  package:
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel into a fresh consumer
        run: |
          echo "EXPECTED_VERSION=$(python -c 'from nozle import __version__; print(__version__)')" >> "$GITHUB_ENV"
          python -m venv "${RUNNER_TEMP}/nozle-wheel-test"
          "${RUNNER_TEMP}/nozle-wheel-test/bin/pip" install dist/*.whl
      - name: Verify installed wheel
        run: |
          cd /tmp
          "${RUNNER_TEMP}/nozle-wheel-test/bin/python" - <<'PY'
          import os
          import importlib.metadata
          import importlib.resources
          import nozle

          assert nozle.__version__ == os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("nozle-sdk") == nozle.__version__
          assert importlib.resources.files("nozle").joinpath("py.typed").is_file()
          for name in nozle.__all__:
              assert getattr(nozle, name) is not None
          PY
